name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    ci:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: ["18.18.0"]

        services:
            # PostgreSQL service container for integration tests
            postgres:
                image: postgres:14-alpine
                env:
                    POSTGRES_DB: trial_booking
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trial_booking
            NODE_ENV: test

        steps:
            # Checkout code
            - name: Checkout code
              uses: actions/checkout@v4

            # Setup Node.js with cache
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            # Install dependencies
            - name: Install dependencies
              run: npm ci

            # Generate Prisma client
            - name: Generate Prisma client
              run: npx prisma generate --schema=libs/database/prisma/schema.prisma

            # Run database migrations
            - name: Run migrations
              run: npx prisma migrate deploy --schema=libs/database/prisma/schema.prisma

            # Type check
            - name: Type check
              run: npm run type-check

            # Lint
            - name: Lint
              run: npm run lint

            # Run tests
            - name: Test
              run: npm test

            # Build application
            - name: Build
              run: npm run build

            # Verify Docker build
            - name: Build Docker image
              run: docker build -f docker/Dockerfile -t trial-booking-backend:latest .
