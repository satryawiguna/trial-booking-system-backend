version: "3.8"

# =============================================================================
# Trial Booking System — Development / Shared Review
# =============================================================================
# Profile: Development
# Database: External PostgreSQL (set DATABASE_URL in environment)
# Seed:     Run manually: docker exec <container> npm run db:seed
# Hot Reload: Enabled (npm run start:dev)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NestJS Backend API (no bundled PostgreSQL)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    container_name: trial-booking-api-dev
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      # Override DATABASE_URL with the external PostgreSQL host
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/trial_booking}
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=debug
    command: npm run start:dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
